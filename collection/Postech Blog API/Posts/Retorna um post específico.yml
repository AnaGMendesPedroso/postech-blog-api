info:
  name: Retorna um post específico
  type: http
  seq: 4
  tags:
    - Posts

http:
  method: GET
  url: "{{baseUrl}}/posts/:id"
  params:
    - name: id
      value: 69c073a47c90539fa596e882
      type: path
      description: ID do post
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Post Encontrado
    description: Retorna o post pelo ID — endpoint público, sem autenticação
    request:
      url: "{{baseUrl}}/posts/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: ID do post
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "id": "",
              "titulo": "",
              "conteudo": "",
              "autor": "",
              "status": "published",
              "createdAt": "",
              "updatedAt": ""
            }
          }
  - name: 404 Post Não Encontrado
    description: Nenhum post com o ID informado
    request:
      url: "{{baseUrl}}/posts/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: ID do post
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": {
              "message": "Post não encontrado"
            }
          }
  - name: 400 ID Inválido
    description: ID com formato inválido (não é um ObjectId válido)
    request:
      url: "{{baseUrl}}/posts/:id"
      method: GET
      params:
        - name: id
          value: "id-invalido"
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": {
              "message": "ID inválido"
            }
          }

