info:
  name: Lista posts com paginação
  type: http
  seq: 2
  tags:
    - Posts

http:
  method: GET
  url: "{{baseUrl}}/posts?status=published"
  params:
    - name: status
      value: draft
      type: query
      description: Filtrar por status (somente professoras — não requer JWT)
      disabled: true
    - name: status
      value: published
      type: query
      description: Filtrar apenas publicados (padrão)
    - name: status
      value: all
      type: query
      description: Todos os posts — visão professora (não requer JWT)
      disabled: true
    - name: page
      value: "1"
      type: query
      description: Número da página
      disabled: true
    - name: limit
      value: "10"
      type: query
      description: Itens por página
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Visão Aluna (published)
    description: Retorna apenas posts publicados — endpoint público, sem autenticação
    request:
      url: "{{baseUrl}}/posts"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "10"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": [
              {
                "id": "",
                "titulo": "",
                "conteudo": "",
                "autor": "",
                "status": "published",
                "createdAt": "",
                "updatedAt": ""
              }
            ],
            "pagination": {
              "page": 1,
              "limit": 10,
              "total": 0,
              "totalPages": 0
            }
          }
  - name: 200 Visão Professora (status=all)
    description: Retorna todos os posts independentemente do status — endpoint público, sem autenticação necessária
    request:
      url: "{{baseUrl}}/posts"
      method: GET
      params:
        - name: status
          value: all
          type: query
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "10"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": [
              {
                "id": "",
                "titulo": "",
                "conteudo": "",
                "autor": "",
                "status": "draft",
                "createdAt": "",
                "updatedAt": ""
              }
            ],
            "pagination": {
              "page": 1,
              "limit": 10,
              "total": 0,
              "totalPages": 0
            }
          }
  - name: 200 Visão Professora (status=draft)
    description: Retorna apenas rascunhos — endpoint público, sem autenticação necessária
    request:
      url: "{{baseUrl}}/posts"
      method: GET
      params:
        - name: status
          value: draft
          type: query
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "10"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
