info:
  name: Busca posts por palavra-chave
  type: http
  seq: 1
  tags:
    - Posts

http:
  method: GET
  url: "{{baseUrl}}/posts/search?q=teste"
  params:
    - name: q
      value: teste
      type: query
      description: Termo de busca
    - name: page
      value: "1"
      type: query
      description: Número da página
      disabled: true
    - name: limit
      value: "10"
      type: query
      description: Itens por página
      disabled: true
    - name: status
      value: all
      type: query
      description: Busca em todos os posts — visão professora (não requer JWT)
      disabled: true
    - name: status
      value: draft
      type: query
      description: Busca apenas em rascunhos
      disabled: true
    - name: status
      value: published
      type: query
      description: Busca apenas em publicados (padrão)
      disabled: true
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Visão Aluna (published)
    description: Busca apenas em posts publicados — endpoint público, sem autenticação
    request:
      url: "{{baseUrl}}/posts/search"
      method: GET
      params:
        - name: q
          value: "node"
          type: query
          description: Termo de busca
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "10"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": [
              {
                "id": "",
                "titulo": "",
                "conteudo": "",
                "autor": "",
                "status": "published",
                "createdAt": "",
                "updatedAt": ""
              }
            ],
            "pagination": {
              "page": 1,
              "limit": 10,
              "total": 0,
              "totalPages": 0
            }
          }
  - name: 200 Visão Professora (status=all)
    description: Busca em todos os posts independentemente do status — endpoint público, sem autenticação necessária
    request:
      url: "{{baseUrl}}/posts/search"
      method: GET
      params:
        - name: q
          value: "node"
          type: query
          description: Termo de busca
        - name: status
          value: all
          type: query
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "10"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": [
              {
                "id": "",
                "titulo": "",
                "conteudo": "",
                "autor": "",
                "status": "draft",
                "createdAt": "",
                "updatedAt": ""
              }
            ],
            "pagination": {
              "page": 1,
              "limit": 10,
              "total": 0,
              "totalPages": 0
            }
          }
  - name: 400 Parâmetro q ausente
    description: Parâmetro de busca obrigatório não informado
    request:
      url: "{{baseUrl}}/posts/search"
      method: GET
      params:
        - name: q
          value: ""
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": {
              "message": "Dados inválidos",
              "details": [
                {}
              ]
            }
          }

