info:
  name: Atualiza um post
  type: http
  seq: 5
  tags:
    - Posts

http:
  method: PUT
  url: "{{baseUrl}}/posts/:id"
  params:
    - name: id
      value: 69c073a47c90539fa596e882
      type: path
  body:
    type: json
    data: |-
      {
        "conteudo": "{{randomConteudo}}",
        "status": "published"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Post Atualizado
    description: Post atualizado com sucesso (requer token de professora)
    request:
      url: "{{baseUrl}}/posts/:id"
      method: PUT
      headers:
        - name: Authorization
          value: "Bearer {{teacherToken}}"
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "titulo": "Título atualizado",
            "conteudo": "Conteúdo atualizado",
            "status": "published"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "id": "",
              "titulo": "Título atualizado",
              "conteudo": "Conteúdo atualizado",
              "autor": "",
              "status": "published",
              "createdAt": "",
              "updatedAt": ""
            }
          }
  - name: 401 Não Autenticado
    description: Token JWT ausente ou inválido
    request:
      url: "{{baseUrl}}/posts/:id"
      method: PUT
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "conteudo": "Novo conteúdo"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": {
              "message": "Token não fornecido"
            }
          }
  - name: 403 Sem Permissão (aluna)
    description: Token válido mas role não é teacher
    request:
      url: "{{baseUrl}}/posts/:id"
      method: PUT
      headers:
        - name: Authorization
          value: "Bearer {{studentToken}}"
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "conteudo": "Novo conteúdo"
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": {
              "message": "Acesso negado: perfil insuficiente"
            }
          }
  - name: 404 Post Não Encontrado
    description: Post não encontrado pelo ID informado
    request:
      url: "{{baseUrl}}/posts/:id"
      method: PUT
      headers:
        - name: Authorization
          value: "Bearer {{teacherToken}}"
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "conteudo": "Novo conteúdo"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": {
              "message": "Post não encontrado"
            }
          }

